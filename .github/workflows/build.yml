name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 portlibs
        run: dkp-pacman -Sy --needed --noconfirm switch-sdl2 switch-sdl2_ttf

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: SimDash
          path: switch-simdash.nro

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: switch-simdash.nro

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - run: make -f Makefile.desktop
