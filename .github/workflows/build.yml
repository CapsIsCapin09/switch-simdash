name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 portlibs
        run: dkp-pacman -Sy --needed --noconfirm switch-sdl2 switch-sdl2_ttf

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: SimDash
          path: switch-simdash.nro

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: switch-simdash.nro

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev
      - run: make -f Makefile.desktop

  linux-kiosk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: |
          bash -n linux/install-kiosk.sh linux/uninstall-kiosk.sh linux/simdash-kiosk
          shellcheck -S error linux/install-kiosk.sh linux/uninstall-kiosk.sh linux/simdash-kiosk

      - name: Package
        run: |
          mkdir -p dist/simdash-linux-kiosk
          cp -a linux/. dist/simdash-linux-kiosk/
          tar -C dist -czf simdash-linux-kiosk.tar.gz simdash-linux-kiosk
          echo "VERSION=$(cat linux/VERSION)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: simdash-linux-kiosk
          path: simdash-linux-kiosk.tar.gz

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-kiosk-v${{ env.VERSION }}
          name: Linux kiosk v${{ env.VERSION }}
          make_latest: true
          body: Files for the L4T Ubuntu SimHub dash kiosk. See linux/README.md for the install guide.
          files: simdash-linux-kiosk.tar.gz
