name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # The image already ships these; only hit pkg.devkitpro.org (which
      # sometimes refuses CI runners) when one is missing.
      - name: Install portlibs
        run: |
          PKGS="switch-sdl2 switch-sdl2_ttf switch-libjpeg-turbo"
          dkp-pacman -Q $PKGS || dkp-pacman -Sy --needed --noconfirm $PKGS

      - name: Build
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: SimDash
          path: switch-simdash.nro

  streamer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build streamer/SimDashStreamer.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: SimDashStreamer
          path: out/SimDashStreamer.exe

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libjpeg-turbo8-dev
      - run: make -f Makefile.desktop

  # Every build of main becomes a GitHub Release named after APP_VERSION in
  # the Makefile (a rebuild of the same version replaces its files). A manual
  # run on another branch makes a "-test" pre-release instead.
  release:
    needs: [switch, streamer]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          VERSION=$(sed -n 's/^APP_VERSION *:= *//p' Makefile)
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION-test" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SimDash ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          overwrite_files: true
          body: |
            **Switch:** copy `switch-simdash.nro` to `/switch/` on the SD card.
            **PC (SimHub dash mode):** run `SimDashStreamer.exe`.
            Setup steps are in the [README](https://github.com/${{ github.repository }}#readme).
          files: |
            dist/switch-simdash.nro
            dist/SimDashStreamer.exe
