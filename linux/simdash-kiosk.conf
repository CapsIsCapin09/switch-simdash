# SimDash kiosk settings. Edit with: sudo nano /etc/simdash-kiosk.conf
# Then reboot, or press Ctrl+Alt+Backspace-free route: sudo systemctl restart gdm3 (or lightdm).

# SimHub web dash address. The root page lists your dashes; tap one to open it.
# To always open one dash, open it once in a PC browser and paste its full URL here.
DASH_URL="http://192.168.1.145:8888/"

# Browser to use: auto, chromium, firefox
BROWSER="auto"

# Page zoom for Chromium (1 = native 1280x720). Try 0.9 or 1.1 if a dash is cropped.
SCALE="1"

# Hide the mouse pointer after this many seconds idle (0 = never hide)
HIDE_CURSOR_AFTER="1"
